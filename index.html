/* =================================================================

/* =================================================================
   CENTRAL IMAGE SYSTEM  (local ./img assets)
   -----------------------------------------------------------------
   Real MAHIDHA photography lives in ./img. Every <img> resolves
   through ph(): pass a direct "img/..." path for precise control,
   or a descriptive label that the resolver maps to the best-fit
   asset (by what each photo actually depicts). A global onError
   handler in <App> swaps any missing file for a branded gradient
   SVG, so nothing ever renders as a blank box.
   ================================================================= */
const A = 'img/';
const F = {
  heroWoman:    A + 'imgi_179_Hom-Slider-mobile-1.png',                                  // woman, navy suit + pearls, navy bg

  lifeEvening:  A + 'imgi_34_Hom-Categories-1.png',                                       // woman seated, navy velvet, layered necklaces
  lifeCeleb:    A + 'imgi_26_Hom-Categories-6.png',                                       // woman laughing, pearl choker, ornate room

const POOL = {

  edit:    [F.flatCelest, F.styleScarf, F.lifeCeleb, F.lifeEvening, F.nizamSet, F.flatSilver],

function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
const pick = (arr, key) => arr[hashStr(key || 'x') % arr.length];

// Branded gradient + gold celestial motif — the never-blank safety net.
function brandSVG(label, w = 800, h = 1000) {
  const t = (label || 'MAHIDHA').replace(/—.*$/,'').trim().slice(0, 26);
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}' viewBox='0 0 800 1000'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#EFE8DF'/><stop offset='1' stop-color='#162033'/></linearGradient></defs><rect width='800' height='1000' fill='url(#g)'/><g fill='none' stroke='#C4A87A' stroke-width='2.4' opacity='0.9'><path d='M430 470a64 64 0 1 1-34-56 48 48 0 0 0 34 56z'/><path d='M330 600l7 22 22 7-22 7-7 22-7-22-22-7 22-7z'/></g><text x='400' y='800' fill='#7A746C' font-family='Georgia,serif' font-size='30' letter-spacing='3' text-anchor='middle'>${t}</text></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

// Resolve a direct path or descriptive label to a local asset.
function ph(label) {
  if (typeof label !== 'string') return brandSVG('MAHIDHA');
  if (label.startsWith('img/') || label.startsWith('http') || label.startsWith('data:')) return label;
  const L = label.toLowerCase();
  // named / page slots
  if (L.includes('medha')) return F.lifeEvening;
  if (L.includes('mahima')) return F.lifeGreen;
  if (L.includes('campaign')) return F.heroLayers;
  if (L.includes('newsletter') || L.includes('celestial bg')) return F.flatCelest;
  if (L.startsWith('map')) return F.lifeStreet;
  if (L.includes('hyderabad')) return F.lifeCeleb;
  if (L.includes('nizam') || L.includes('heritage')) return F.nizamSet;
  if (L.includes('our story') || L.includes('story')) return F.editFeminist;
  if (L.includes('care')) return F.pearlVintage;
  if (L.includes('faq')) return F.flatGold;
  if (L.includes('shipping') || L.includes('packaging')) return F.giftPink;
  if (L.includes('size')) return F.braceSilver;
  if (L.includes('contact')) return F.heroBlazer;
  if (L.startsWith('cart')) return F.neckLariat;
  if (L.startsWith('gift')) return pick(POOL.gift, label);
  // category circles
  if (L.includes('category')) {
    if (L.includes('earring')) return F.earrCrystal;
    if (L.includes('ring')) return F.ringDome;
    if (L.includes('bracelet')) return F.braceSilver;
    return F.neckRope;
  }
  // people / lifestyle / UGC
  if (/lifestyle|ugc|on model|on her|wearing|woman|portrait|neckline/.test(L)) return pick(POOL.women, label);
  if (/vacation|travel|beach|escape/.test(L)) return pick([F.styleScarf, F.lifeGreen, F.lifeCeleb], label);
  if (/edit —|edit-|evening|celebration|cosmic|celestial/.test(L)) return pick(POOL.edit, label);
  // jewellery shots
  if (/earring|stud/.test(L)) return /on ear|on model|styled|lifestyle/.test(L) ? pick(POOL.women, label) : F.earrDrop;
  if (/necklace|choker|wrap|lariat/.test(L)) return /on model|styled|neckline/.test(L) ? pick(POOL.women, label) : pick([F.neckLariat, F.neckRope], label);
  if (/bracelet|wrist/.test(L)) return F.braceSilver;
  if (/\bring\b/.test(L)) return F.ringDome;
  if (/pearl|jewel|product|detail|macro|flatlay|silver|gold|layer/.test(L)) return pick(POOL.jewelry, label);
  return pick(POOL.edit, label);
}

/* ---------- Thin gold-outline line icons (celestial-minimal) ---------- */

/* =================================================================
   APP-WIDE CONTEXT (routing + cart) — React state only, no storage.
   ================================================================= */
const Store = createContext(null);
const useStore = () => useContext(Store);

function StoreProvider({ children }) {
  const [route, setRoute] = useState({ name: 'home', params: {} });
  const [cart, setCart] = useState([]);          // [{id, qty}]
  const [wishlist, setWishlist] = useState([]);  // [id]
  const [cartOpen, setCartOpen] = useState(false);

  const navigate = useCallback((name, params = {}) => {
    setRoute({ name, params });
    window.scrollTo({ top: 0, behavior: 'auto' });
  }, []);

  const addToCart = useCallback((id, qty = 1) => {
    setCart((c) => {
      const ex = c.find((i) => i.id === id);
      if (ex) return c.map((i) => i.id === id ? { ...i, qty: i.qty + qty } : i);
      return [...c, { id, qty }];
    });
    setCartOpen(true);
  }, []);
  const setQty = useCallback((id, qty) => {
    setCart((c) => qty <= 0 ? c.filter((i) => i.id !== id) : c.map((i) => i.id === id ? { ...i, qty } : i));
  }, []);
  const removeFromCart = useCallback((id) => setCart((c) => c.filter((i) => i.id !== id)), []);
  const toggleWish = useCallback((id) => setWishlist((w) => w.includes(id) ? w.filter((x) => x !== id) : [...w, id]), []);

  const cartCount = cart.reduce((n, i) => n + i.qty, 0);
  const cartItems = cart.map((i) => ({ ...PRODUCTS.find((p) => p.id === i.id), qty: i.qty })).filter((p) => p.id);
  const cartTotal = cartItems.reduce((s, p) => s + (p.price || 0) * p.qty, 0);

  const value = { route, navigate, cart, cartItems, cartCount, cartTotal, addToCart, setQty, removeFromCart,
                  wishlist, toggleWish, cartOpen, setCartOpen };
  return <Store.Provider value={value}>{children}</Store.Provider>;
}

/* =================================================================

   ================================================================= */
function Reveal({ children, className = '', as: Tag = 'div', delay = 0 }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { el.classList.add('in'); io.unobserve(el); } });
    }, { threshold: 0.12 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return <Tag ref={ref} className={`reveal ${className}`} style={delay ? { transitionDelay: delay + 'ms' } : undefined}>{children}</Tag>;
}

function Button({ children, variant = 'primary', as = 'button', className = '', ...rest }) {
  const base = 'inline-flex items-center justify-center gap-2 rounded-btn font-sans text-[13px] tracking-nav uppercase transition-colors duration-300 px-7 py-3.5 cursor-pointer';
  const styles = {
    primary: 'bg-navy text-pearl hover:bg-navy-soft',
    secondary: 'bg-transparent text-charcoal border border-navy/70 hover:bg-navy hover:text-pearl',
    ghostLight: 'bg-transparent text-ivory border border-ivory/40 hover:border-gold hover:text-gold',
    light: 'bg-ivory text-navy hover:bg-white',
  };
  const Tag = as;
  return <Tag className={`${base} ${styles[variant]} ${className}`} {...rest}>{children}</Tag>;
}

function FilterControls({ filters, setFilters, sort, setSort, count, perPage, setPerPage, mobile, onClose }) {
  const allStyles = [...new Set(PRODUCTS.map((p) => p.style))];
  const allMaterials = [...new Set(PRODUCTS.map((p) => p.material))];
  const toggle = (key, val) => setFilters((f) => {
    const set = new Set(f[key]); set.has(val) ? set.delete(val) : set.add(val);
    return { ...f, [key]: [...set] };
  });
  const Group = ({ title, options, k }) => (
    <div className="py-5 border-b border-charcoal/10">
      <h4 className="font-sans text-[12px] tracking-nav uppercase text-charcoal mb-3">{title}</h4>
      <div className="space-y-2">
        {options.map((o) => (
          <label key={o} className="flex items-center gap-2.5 cursor-pointer text-[14px] text-taupe hover:text-charcoal">
            <input type="checkbox" checked={filters[k].includes(o)} onChange={() => toggle(k, o)}
                   className="accent-navy w-4 h-4" />
            {o}
          </label>
        ))}
      </div>
    </div>
  );
  return (
    <div className={mobile ? 'p-6' : ''}>
      {mobile && (
        <div className="flex items-center justify-between mb-2">
          <h3 className="font-serif text-[22px]">Filter &amp; Sort</h3>
          <button aria-label="Close filters" onClick={onClose}><Icons.close /></button>
        </div>
      )}
      <Group title="Style" options={allStyles} k="style" />
      <Group title="Material" options={allMaterials} k="material" />
      <div className="py-5 border-b border-charcoal/10">
        <h4 className="font-sans text-[12px] tracking-nav uppercase text-charcoal mb-3">Price</h4>
        <div className="space-y-2">
          {[['Under ₹500','u500'],['₹500 – ₹1500','m'],['₹1500 +','h']].map(([label, v]) => (
            <label key={v} className="flex items-center gap-2.5 cursor-pointer text-[14px] text-taupe hover:text-charcoal">
              <input type="checkbox" checked={filters.price.includes(v)} onChange={() => toggle('price', v)} className="accent-navy w-4 h-4" />
              {label}
            </label>
          ))}
        </div>
      </div>
      {mobile && (
        <div className="pt-5">
          <label className="block font-sans text-[12px] tracking-nav uppercase text-charcoal mb-2">Sort</label>
          <select value={sort} onChange={(e) => setSort(e.target.value)} className="w-full border border-charcoal/20 rounded-btn px-3 py-2.5 bg-pearl text-[14px]">
            <option value="featured">Featured</option><option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option><option value="rating">Top Rated</option>
          </select>
          <Button className="w-full mt-5" onClick={onClose}>Show {count} results</Button>
        </div>
      )}

  );
}

/* =================================================================
   LISTING PAGE
   ================================================================= */
function ListingPage({ cat }) {
  const [filters, setFilters] = useState({ style: [], material: [], price: [] });
  const [sort, setSort] = useState('featured');
  const [perPage, setPerPage] = useState(12);
  const [sheet, setSheet] = useState(false);
  const styleParam = useStore().route.params.style;

  useEffect(() => { setFilters({ style: styleParam ? [styleParam] : [], material: [], price: [] }); }, [cat, styleParam]);

  // base set per category
  let base = PRODUCTS;
  if (cat === 'New Arrivals') base = PRODUCTS.filter((p) => p.status === 'new');
  else if (cat === 'S925') base = PRODUCTS.filter((p) => /S925|Sterling/.test(p.material));

  const priceMatch = (p) => {
    if (!filters.price.length) return true;
    return filters.price.some((b) => b === 'u500' ? (p.price && p.price < 500) : b === 'm' ? (p.price >= 500 && p.price <= 1500) : (p.price > 1500));
  };
  let items = base.filter((p) =>
    (!filters.style.length || filters.style.includes(p.style)) &&
    (!filters.material.length || filters.material.includes(p.material)) &&
    priceMatch(p)
  );
  if (sort === 'low') items = [...items].sort((a, b) => (a.price || 0) - (b.price || 0));
  else if (sort === 'high') items = [...items].sort((a, b) => (b.price || 0) - (a.price || 0));
  else if (sort === 'rating') items = [...items].sort((a, b) => (b.rating || 0) - (a.rating || 0));
  const shown = items.slice(0, perPage);

  return (
    <>
      <PageHero overline="Collection" title={cat} sub={CATEGORY_INTRO[cat] || ''} img={`${cat} — woman wearing pearls, editorial header`} />
      <div className="max-w-wrap mx-auto px-5 py-6 border-b border-charcoal/10">
        <Breadcrumb trail={[{ label: 'Home', to: 'home' }, { label: cat }]} />
      </div>

      <section className="max-w-wrap mx-auto px-5 py-12 grid lg:grid-cols-[240px_1fr] gap-10">
        {/* Sidebar (desktop) */}
        <aside className="hidden lg:block">
          <h3 className="font-serif text-[24px] mb-2">Filter</h3>
          <FilterControls filters={filters} setFilters={setFilters} sort={sort} setSort={setSort} count={items.length} perPage={perPage} setPerPage={setPerPage} />
        </aside>

        <div>
          {/* toolbar */}
          <div className="flex items-center justify-between gap-4 mb-8 flex-wrap">
            <p className="text-taupe text-[14px]">{items.length} {items.length === 1 ? 'piece' : 'pieces'}</p>
            <div className="flex items-center gap-3">
              <button onClick={() => setSheet(true)} className="lg:hidden font-sans text-[12px] tracking-nav uppercase border border-charcoal/20 rounded-btn px-4 py-2.5 flex items-center gap-2">
                <Icons.menu size={15} /> Filter
              </button>
              <div className="hidden sm:flex items-center gap-2">
                <span className="font-sans text-[12px] tracking-nav uppercase text-taupe">Show</span>
                {[9,12,18,24].map((n) => (
                  <button key={n} onClick={() => setPerPage(n)} className={`font-sans text-[13px] px-2 ${perPage === n ? 'text-charcoal underline underline-offset-4 decoration-gold' : 'text-taupe hover:text-charcoal'}`}>{n}</button>
                ))}
              </div>
              <select value={sort} onChange={(e) => setSort(e.target.value)} aria-label="Sort products"
                      className="border border-charcoal/20 rounded-btn px-3 py-2.5 bg-pearl text-[13px] font-sans">
                <option value="featured">Featured</option><option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option><option value="rating">Top Rated</option>
              </select>
            </div>
          </div>

          {shown.length ? <ProductGrid items={shown} /> : <EmptyState />}
        </div>
      </section>

      {/* Mobile filter sheet (slide-up) */}
      <div className={`fixed inset-0 z-50 lg:hidden ${sheet ? '' : 'pointer-events-none'}`} aria-hidden={!sheet}>
        <div className={`absolute inset-0 bg-navy/40 transition-opacity ${sheet ? 'opacity-100' : 'opacity-0'}`} onClick={() => setSheet(false)} />
        <div className={`absolute inset-x-0 bottom-0 max-h-[85vh] overflow-y-auto bg-pearl rounded-t-2xl transition-transform duration-300 ${sheet ? 'translate-y-0' : 'translate-y-full'}`}>
          <FilterControls mobile onClose={() => setSheet(false)} filters={filters} setFilters={setFilters} sort={sort} setSort={setSort} count={items.length} perPage={perPage} setPerPage={setPerPage} />
        </div>
      </div>
    </>
  );
}

/* =================================================================
   ACCORDION (shared)
   ================================================================= */
function Accordion({ items, single = false, defaultOpen = [] }) {
  const [open, setOpen] = useState(new Set(defaultOpen));
  const toggle = (i) => setOpen((s) => {
    const n = new Set(single ? [] : s);
    s.has(i) ? n.delete(i) : n.add(i);
    return n;
  });
  return (
    <div className="divide-y divide-charcoal/10 border-y border-charcoal/10">
      {items.map((it, i) => {
        const isOpen = open.has(i);
        return (
          <div key={i}>
            <button onClick={() => toggle(i)} aria-expanded={isOpen}
                    className="w-full flex items-center justify-between gap-4 py-5 text-left">
              <span className="font-serif text-[21px] md:text-[23px] text-charcoal">{it.q}</span>
              <span className={`text-gold shrink-0 transition-transform duration-300 ${isOpen ? 'rotate-45' : ''}`}><Icons.plus size={20} /></span>
            </button>
            <div className={`overflow-hidden transition-all duration-300 ${isOpen ? 'max-h-[600px] opacity-100' : 'max-h-0 opacity-0'}`}>
              <div className="pb-6 text-taupe text-[16px] leading-[1.8] max-w-3xl">{it.a}</div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

  // Uses capture phase because <img> error events don't bubble.
  useEffect(() => {
    const onErr = (e) => {
      const el = e.target;
      if (!(el && el.tagName === 'IMG')) return;
      if (el.getAttribute('data-fb')) return; // already swapped
      el.setAttribute('data-fb', '1');
      el.src = brandSVG(el.alt, 800, 1000);
    };
    window.addEventListener('error', onErr, true);
    return () => window.removeEventListener('error', onErr, true);
  }, []);

  let page;
  switch (route.name) {
    case 'home': page = <HomePage />; break;
    case 'list': page = <ListingPage cat={route.params.cat || 'All Jewellery'} />; break;
    case 'style': page = <StylePage />; break;
    case 'nizam': page = <NizamPage />; break;
    case 'pdp': page = <PDP id={route.params.id} />; break;
    case 'story': page = <StoryPage />; break;
    case 'care': page = <CarePage />; break;
    case 'faqs': page = <FAQPage />; break;
    case 'gift': page = <GiftPage />; break;
    case 'shipping': page = <ShippingPage />; break;
    case 'size': page = <SizePage />; break;
    case 'contact': page = <ContactPage />; break;
    case 'cart': page = <CartPage />; break;
    default: page = <HomePage />;
  }
  return (
    <div className="min-h-screen flex flex-col bg-pearl">
      <UtilityBar />
      <Header />
      <main className="flex-1">{page}</main>
      <Footer />
      <CartDrawer />
    </div>
  );
}

/* =================================================================
   MOUNT
   ================================================================= */
ReactDOM.createRoot(document.getElementById('root')).render(
  <StoreProvider><App /></StoreProvider>
);
  </script>
</body>
</html>
